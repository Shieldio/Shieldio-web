function portrait(id){return `<svg class="photo" viewBox="${id==='helan'?'252 262 153 150':'671 262 150 149'}" aria-hidden="true"><image href="reference-frame.jpeg" width="1536" height="1067"/></svg>`;}
$('grid').innerHTML=apps.map(([id,label])=>`<button class="tile ${id==='helan'||id==='bende'?'portrait':''}" data-app="${id}" aria-label="${label}" title="${label}">${id==='helan'||id==='bende'?portrait(id):`<svg viewBox="0 0 100 100" aria-hidden="true">${framed.has(id)?'<use href="#frame"/>':''}<use href="#${id}" ${framed.has(id)?'x="5" y="5" width="90" height="90"':''}/></svg>`}<span class="tile-label">${label}</span></button>`).join('');
function drops(){$('juice').querySelector('.drops').innerHTML=[0,1,2].map(i=>`<svg class="drop ${i>=water?'empty':''}" viewBox="0 0 20 28"><use href="#drop"/></svg>`).join('');}drops();
const button=(id,text,secondary=false)=>`<button id="${id}" class="action${secondary?' secondary':''}">${text}</button>`;
const on=(id,fn)=>$(id).addEventListener('click',fn);
function layout(art,copy,cls=''){panel.innerHTML=`<div class="art ${cls}" id="art">${art}</div><div class="copy">${copy}<div class="result" id="result" role="status" aria-live="polite"></div></div>`;}
function say(text){$('result').textContent=text;}
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function cleanup(){generation++;stopCamera();timers.forEach(clearTimeout);timers=[];win.classList.remove('video-mode');}
function home(){cleanup();current=null;win.hidden=true;phone.classList.remove('has-window');panel.replaceChildren();if(last)last.focus();}
on('home',home);on('back',home);on('about',()=>{last=$('about');open('about');});on('juice',()=>{last=$('juice');open('bottle');});
$('grid').addEventListener('click',e=>{let b=e.target.closest('[data-app]');if(b){last=b;open(b.dataset.app);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!win.hidden)home();});
function fullscreenLabel(){$('fullscreen').textContent=document.fullscreenElement?'Zmenšit':'Na celou obrazovku';}document.addEventListener('fullscreenchange',fullscreenLabel);
on('fullscreen',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(phone.requestFullscreen)await phone.requestFullscreen();else{open('about');$('title').textContent='Celá obrazovka';panel.innerHTML='<div class="about-copy"><p>Tento prohlížeč celoobrazovkový režim nepodporuje. Otoč zařízení na šířku, případně v Safari zvol Sdílet → Přidat na plochu.</p></div>';}}catch{open('about');$('title').textContent='Celá obrazovka není dostupná';}});
const interpret='<p class="hint">Hravá funkce doplněná k ikoně z klipu.</p>';
function open(id){cleanup();current=id;win.hidden=false;phone.classList.add('has-window');$('title').textContent=apps.find(a=>a[0]===id)?.[1]||'O rekonstrukci';
if(id==='bottle'){layout(`<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="bottle-clip"><path d="M40 22h18v63H34V42Z"/></clipPath></defs><rect class="water-level" id="water-level" clip-path="url(#bottle-clip)" x="28" width="40" y="${85-water*21}" height="${water*21}"/><use href="#bottle"/></svg>`,'<p>Šťáva do kartonového telefonu.</p>'+button('sip','Napít se')+button('refill','Doplnit šťávu',true)+interpret);function render(){drops();$('water-level').setAttribute('y',85-water*21);$('water-level').setAttribute('height',water*21);$('sip').disabled=water===0;}render();on('sip',()=>{water=Math.max(0,water-1);render();say(water?'Ještě zbývá trochu šťávy.':'Prázdno. Doplníme?');});on('refill',()=>{water=3;render();say('Zase plno.');});}
if(id==='dog'){layout(svg('dog'),'<p>Jeden papírový pes. Vždycky má radost, že tě vidí.</p>'+button('pet','Pohladit')+button('call-dog','Přivolat',true)+interpret);on('pet',()=>{$('art').classList.remove('jump');void $('art').offsetWidth;$('art').classList.add('jump');say('Haf!');});on('call-dog',()=>{$('art').classList.remove('jump');void $('art').offsetWidth;$('art').classList.add('jump');say('Už běží.');});}
if(id==='heart'){layout(svg('heart'),'<p>Malé připomenutí někoho, koho máš rád.</p><label for="heart-note">Na koho myslíš?</label><input id="heart-note" maxlength="100" placeholder="Jméno nebo pár slov">'+button('heart-beat','Rozbušit srdce')+interpret);on('heart-beat',()=>{const art=$('art');art.classList.remove('heart-beat');void art.offsetWidth;art.classList.add('heart-beat');say($('heart-note').value.trim()?'Chvíle pro '+$('heart-note').value.trim()+'.':'Někdy stačí si vzpomenout.');});}
if(id==='sun'){layout(svg('sun'),'<p>Slunce, které můžeš rozsvítit dotykem.</p>'+button('sun-toggle',light?'Zhasnout slunce':'Rozsvítit slunce')+interpret,'sun-art');$('art').classList.toggle('night',!light);on('sun-toggle',()=>{light=!light;$('art').classList.toggle('night',!light);$('sun-toggle').textContent=light?'Zhasnout slunce':'Rozsvítit slunce';say(light?'A je světlo.':'Dobrou noc.');});}
if(id==='helan'||id==='bende'){layout(`<div class="portrait-large">${portrait(id)}</div>`,'<p>Portrét z dodaného záběru. V klipu se jednotlivá okénka zvětšují přes plochu telefonu.</p>'+button('play','Přehrát původní videoklip')+'<p class="hint">Přehrávání načte YouTube. Pokud video nepůjde přehrát, použij odkaz pod telefonem.</p>');on('play',()=>{win.classList.add('video-mode');$('art').innerHTML='<iframe class="video-frame" title="Pavel Helan a Petr Bende — iBůh" src="https://www.youtube-nocookie.com/embed/D7bbXa_7OOU?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';});}
if(id==='camera'||id==='eye'){cameraPanel(id);}
if(id==='photos'){layout('<div class="gallery" id="gallery"></div>','<p>Fotky z tohoto kartonového telefonu.</p><label for="photo-file" class="action">Přidat vlastní fotku</label><input id="photo-file" type="file" accept="image/*" hidden>'+button('to-camera','Otevřít fotoaparát',true)+'<p class="hint">Fotky zůstávají jen v paměti této stránky. Nikam je neposíláme; obnovením stránky zmizí.</p>');function gallery(){const g=$('gallery');g.replaceChildren();if(!photos.length){g.innerHTML='<p class="hint">Zatím tu není žádná fotka.</p>';return;}photos.forEach((url,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Otevřít fotku '+(i+1));const img=document.createElement('img');img.src=url;img.alt='Fotka '+(i+1);b.append(img);b.addEventListener('click',()=>{g.replaceChildren();const large=document.createElement('img');large.src=url;large.alt='Vybraná fotka';large.className='photo-view';g.style.display='block';g.append(large);const back=document.createElement('button');back.className='action';back.textContent='Zpět do galerie';back.addEventListener('click',()=>{g.style.display='grid';gallery();});g.append(back);});g.append(b);});}gallery();$('photo-file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){say('Vyber obrázek.');return;}if(f.size>20*1024*1024){say('Vyber fotku menší než 20 MB.');return;}const url=URL.createObjectURL(f);urls.push(url);photos.push(url);gallery();say('Fotka přidána jen v tomto prohlížeči.');});on('to-camera',()=>open('camera'));}
if(id==='cube'){layout('<div class="puzzle" id="puzzle" aria-label="Světelný hlavolam"></div>','<p>Rozsviť všech devět polí. Dotyk přepne políčko a jeho přímé sousedy.</p>'+button('new-puzzle','Nová hra')+'<p class="hint">Ikona kostky je z klipu; tento světelný hlavolam je doplněný.</p>','puzzle-art');let cells,moves=0;function flip(i){const r=Math.floor(i/3),c=i%3;[i,r>0?i-3:-1,r<2?i+3:-1,c>0?i-1:-1,c<2?i+1:-1].filter(n=>n>=0).forEach(n=>cells[n]=!cells[n]);}function draw(){const board=$('puzzle');board.replaceChildren();cells.forEach((v,i)=>{const b=document.createElement('button');b.className=v?'lit':'';b.setAttribute('aria-label','Pole '+(i+1));b.setAttribute('aria-pressed',String(v));b.addEventListener('click',()=>{flip(i);moves++;draw();say(cells.every(Boolean)?'Hotovo! Počet tahů: '+moves:'Počet tahů: '+moves);board.children[i].focus();});board.append(b);});}function start(){cells=Array(9).fill(true);moves=0;[0,2,4,7,Math.floor(Math.random()*9)].forEach(flip);if(cells.every(Boolean))flip(4);draw();say('');}on('new-puzzle',start);start();}
if(id==='china'){layout(svg('china'),'<p>CHINA / CENSORED / INTERNET</p><label for="censor-text">Zkus něco napsat</label><input id="censor-text" maxlength="120" placeholder="Tvoje zpráva">'+button('censor','Zacenzurovat')+'<p class="hint">Lokální vizuální hříčka s původní ikonou. Nic nefiltruje ani neodesílá na internet.</p>');let censored=false;on('censor',()=>{if(!$('censor-text').value.trim()){say('Nejdřív napiš zprávu.');return;}censored=!censored;say(censored?Array.from($('censor-text').value).map(c=>/\s/.test(c)?c:'█').join(''):$('censor-text').value);$('censor').textContent=censored?'Odkrýt zprávu':'Zacenzurovat';});}
if(id==='mail'){layout(svg('mail'),'<label for="message">Co chceš vložit do obálky?</label><textarea id="message" maxlength="1500" placeholder="Pár slov jen pro tebe…"></textarea>'+button('envelope','Zavřít do obálky')+'<p class="hint">Obálka zůstává v této stránce. Nic se nikam neodesílá a po obnovení zmizí.</p>');$('message').value=note;on('envelope',()=>{if($('message').hidden){$('message').hidden=false;$('envelope').textContent='Zavřít do obálky';say('');return;}note=$('message').value.trim();if(!note){say('Nejdřív napiš pár slov.');return;}$('message').hidden=true;$('envelope').textContent='Otevřít obálku';say('Schováno v papírové obálce.');});}
if(id==='house'){layout('<svg viewBox="0 0 100 100" aria-hidden="true"><rect class="house-glow" x="31" y="62" width="13" height="25"/><rect class="house-glow" x="56" y="60" width="12" height="14"/><use href="#house"/><path class="door" d="M31 62h13v25H31Z"/></svg>','<p>Rozsvítit, otevřít. Být na chvíli doma.</p>'+button('house-open','Rozsvítit doma')+interpret);on('house-open',()=>{const open=$('art').classList.toggle('house-open');$('house-open').textContent=open?'Zhasnout':'Rozsvítit doma';say(open?'Vítej doma.':'');});}
if(id==='tree'){layout(svg('tree','tree-grown'),'<p>Nech papírový strom vyrůst.</p><label for="growth">Velikost stromu</label><input id="growth" type="range" min="35" max="100" value="55">'+button('grow','Nechat vyrůst')+interpret);function grow(){$('art').querySelector('svg').style.transform='scale('+Number($('growth').value)/100+')';}grow();$('growth').addEventListener('input',grow);on('grow',()=>{$('growth').value='100';grow();say('Trochu prostoru k růstu.');});}
if(id==='world'){layout(svg('world'),'<p>Celý svět v jedné nakousnuté ikonce.</p><label for="rotation">Otočit svět</label><input id="rotation" type="range" min="-180" max="180" value="0">'+button('spin','Roztočit svět')+interpret);const globe=$('art').querySelector('svg');$('rotation').addEventListener('input',()=>{globe.classList.remove('world-spin');globe.style.transform='rotate('+Number($('rotation').value)+'deg)';$('spin').textContent='Roztočit svět';});on('spin',()=>{const spinning=globe.classList.toggle('world-spin');$('spin').textContent=spinning?'Zastavit svět':'Roztočit svět';});}
if(id==='about'){panel.innerHTML='<div class="about-copy"><h2>Podoba podle tvých screenshotů</h2><p>Telefon na šířku, mřížka 5 × 3, světlé kresby na kartonu, SIGNÁL a ŠŤÁVA. Pořadí ikon i portréty vycházejí z dodaného záběru.</p><h2>Co ukazují záběry a co je doplněné</h2><p>Portréty se otevírají do většího okna. iBůh má náhled se středovým křížkem a okem v trojúhelníku podle scény s dopravní značkou. Ostatní interakce jsou hravé doplnění; jejich skutečné chování nelze ze screenshotů ověřit.</p><p>Fotoaparát funguje po tvém zapnutí a povolení kamery. Žádné rozpoznávání značek, navigace ani „Boží odpovědi“ tu neběží.</p><p>Texty a vlastní fotografie zůstávají v paměti otevřené stránky. Přehrání klipu načítá YouTube.</p><p class="hint">Neoficiální rekonstrukce. Předloha: Pavel Helan a Petr Bende — iBůh (2013). Námět a režie Radek Petráš a Václav Dvořák; animace Jan Kolegar.</p></div>';}
$('title').focus();}
function cameraPanel(id){const isEye=id==='eye';layout(`<div class="camera-scene" id="camera-scene"><svg class="sign" viewBox="0 0 130 190" aria-hidden="true"><path d="M59 80h12v110H59Z" fill="#777361"/><circle cx="65" cy="65" r="58" fill="#a25c50"/><circle cx="65" cy="65" r="45" fill="#d8d1b7"/><path d="M46 98V52q0-13 15-13h20V25l26 23-26 22V55H62v43Z" fill="#45403a"/></svg><video id="camera-video" playsinline muted hidden></video>${isEye?'<span class="reticle" aria-hidden="true">+</span>'+svg('eye','eye-overlay'):''}</div>`,`<p>${isEye?'Průhled s křížkem a symbolem iBoha podle záběru s dopravní značkou.':'Otevři fotoaparát a zachyť svůj vlastní kousek světa.'}</p>`+button('camera-start','Zapnout fotoaparát')+(isEye?button('cross-toggle','Skrýt křížek',true):button('take-photo','Vyfotit',true))+'<p class="hint">'+(isEye?'Jde o vizuální efekt. Nerozpoznává dopravní značky ani neurčuje cestu.':'Fotka se uloží jen do galerie této otevřené stránky.')+'</p>','camera-art');
if(!isEye)$('take-photo').disabled=true;
on('camera-start',async()=>{if(stream){stopCamera();$('camera-video').hidden=true;$('camera-start').textContent='Zapnout fotoaparát';if(!isEye)$('take-photo').disabled=true;say('Fotoaparát vypnutý.');return;}if(!navigator.mediaDevices?.getUserMedia){say('Fotoaparát tento prohlížeč nepodporuje. Ilustrační průhled zůstává funkční.');return;}const token=generation;const start=$('camera-start');start.disabled=true;try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(token!==generation){s.getTracks().forEach(t=>t.stop());return;}stream=s;const video=$('camera-video');video.srcObject=s;video.hidden=false;await video.play();if(token!==generation){s.getTracks().forEach(t=>t.stop());return;}start.textContent='Vypnout fotoaparát';if(!isEye)$('take-photo').disabled=false;say('Fotoaparát zapnutý.');}catch(e){if(token===generation){stopCamera();$('camera-video').hidden=true;say(e.name==='NotAllowedError'?'Kamera nebyla povolena. Můžeš zůstat u ilustračního průhledu.':'Fotoaparát se nepodařilo spustit. Zkus jiný prohlížeč nebo zařízení.');}}finally{if(token===generation)start.disabled=false;}});
if(isEye){on('cross-toggle',()=>{const cross=panel.querySelector('.reticle');cross.hidden=!cross.hidden;$('cross-toggle').textContent=cross.hidden?'Zobrazit křížek':'Skrýt křížek';});}else{on('take-photo',()=>{const video=$('camera-video');if(!stream||!video.videoWidth){say('Fotoaparát ještě není připravený.');return;}const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);photos.push(canvas.toDataURL('image/jpeg',.86));const flash=document.createElement('span');flash.className='capture-flash';$('camera-scene').append(flash);later(()=>flash.remove(),400);say('Fotka je v galerii. Počet fotek: '+photos.length);});}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream){stopCamera();const v=$('camera-video');if(v)v.hidden=true;const b=$('camera-start');if(b)b.textContent='Zapnout fotoaparát';const capture=$('take-photo');if(capture)capture.disabled=true;}});window.addEventListener('pagehide',()=>{cleanup();urls.forEach(URL.revokeObjectURL);});
})();
</script></body></html>
