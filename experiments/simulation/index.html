<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14212a"><title>SHiELDiO Sim — elektrotechnická laboratoř</title><meta name="description" content="Školní laboratoř elektrických obvodů, číslicové techniky a FBD."><link rel="stylesheet" href="./style.css"></head><body>
<header><a class="brand" href="https://shieldio.cz">SHiELDiO <span>Sim</span></a><button id="modeSwitch">Elektrické obvody ▾</button><details class="menu"><summary>Soubor</summary><div class="popup"><button id="new">Nové zapojení</button><button id="open">Otevřít soubor…</button><button id="save">Uložit soubor</button><button id="share">Sdílet odkaz…</button><hr><button id="exportPng">Export PNG</button><button id="exportSvg">Export SVG</button><button id="exportCsv">Naměřená data CSV</button></div></details><details id="editMenu" class="menu"><summary>Upravit</summary><div class="popup"><button id="selectAll">Vybrat vše <kbd>⌘/Ctrl+A</kbd></button><button id="copySelection">Kopírovat <kbd>⌘/Ctrl+C</kbd></button><button id="pasteSelection">Vložit <kbd>⌘/Ctrl+V</kbd></button></div></details><details id="examplesMenu" class="menu"><summary>Zapojení a ukázky</summary><div id="examples" class="popup examples"></div></details><input id="title" aria-label="Název zapojení" value="Nové zapojení"><button id="help" title="Nápověda">?</button><button id="theme" title="Světlý / tmavý režim">◐ Motiv</button></header>
<nav class="tools" aria-label="Operace editoru"><button id="libraryToggle" title="Zobrazit / skrýt součástky">Součástky</button><div class="separator"></div><button data-tool="select" class="active" title="Vybrat (Q)">Vybrat</button><button data-tool="wire" title="Propojit vývody (W)">Propojit</button><button id="rotate" title="Otočit (Shift+R; při umisťování také R nebo pravé tlačítko)">Otočit</button><button id="delete" title="Smazat výběr (Delete)">Smazat</button><button id="undo" title="Zpět (Ctrl/Cmd+Z)">↶</button><button id="redo" title="Znovu (Ctrl/Cmd+Shift+Z)">↷</button><button id="cancel" hidden>Ukončit · Esc</button><div class="separator"></div><label id="flowLabel">Pohyb <select id="flowMode" aria-label="Zobrazení pohybu ve vodičích"><option value="current">Proud →</option><option value="electrons">Elektrony ←</option><option value="none">Vypnout</option></select></label><div class="grow"></div><button id="propertiesToggle">Vlastnosti</button><button id="run" class="primary">Spustit</button></nav>
<main id="workbench"><aside id="library" class="panel"><div class="panel-head"><strong>Součástky</strong><button id="libraryClose" aria-label="Skrýt součástky">×</button></div><input id="search" aria-label="Hledat součástku" placeholder="Hledat součástku"><div id="categories"></div><div id="parts"></div></aside><div id="leftResize" class="resize vertical" role="separator" tabindex="0" aria-label="Šířka knihovny" aria-orientation="vertical"></div>
<section class="center"><div id="drawing"><svg id="schematic" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="Pracovní plocha zapojení"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r=".75"/></pattern></defs><rect x="-10000" y="-10000" width="20000" height="20000" fill="url(#grid)"/><g id="scene"></g><g id="preview" pointer-events="none"></g></svg><div class="canvas-controls"><button id="fit" title="Vycentrovat celé zapojení">Vycentrovat</button><button id="zoomOut" aria-label="Oddálit schéma">−</button><output id="zoom">100 %</output><button id="zoomIn" aria-label="Přiblížit schéma">+</button></div><div id="emptyHint">Přidejte součástku nebo vyberte ukázku.</div></div><div hidden><span id="stats"></span><span id="status">Připraveno</span></div><div id="scopeResize" class="resize horizontal" role="separator" tabindex="0" aria-label="Výška osciloskopů" aria-orientation="horizontal"></div>
<section id="instruments"><div class="instrument-controls"><button id="restart" title="Obnovit počáteční stav">Reset</button><button id="stepBack" title="Předchozí vzorek">←</button><button id="stepNext" title="Následující vzorek">→</button><label>Rychlost <input id="speed" type="range" min="-2" max="1" step=".01" value="0" aria-label="Rychlost simulace"><output id="speedValue">1 s / s</output></label><details class="speed-menu"><summary>Přesně</summary><div class="speed-popup"><label>Simulační sekundy / skutečnou sekundu<input id="speedExact" type="number" min="1e-12" max="100" step="any" value="1"></label><button id="speedAdaptive">1 perioda za sekundu</button><output id="speedPeriod"></output></div></details><label id="durationLabel">Čas / dílek <input id="duration" aria-label="Šířka časového okna" value="10m"> s / dílek</label><output id="time">t = 0 s</output><div class="grow"></div><button id="addScope">+ Osciloskop</button><button id="frequencyAnalysis">Přenos / fáze</button><button id="scopeToggle" title="Skrýt / zobrazit osciloskopy">Skrýt</button></div><div id="scopes"></div><div class="timeline"><input id="timeline" aria-label="Časový kurzor záznamu" type="range" min="0" max="1000" step="1" value="0"><output id="timeScale"></output></div></section><button id="showScopes" hidden>Zobrazit osciloskopy</button></section>
<div id="rightResize" class="resize vertical" role="separator" tabindex="0" aria-label="Šířka vlastností" aria-orientation="vertical"></div><aside id="inspector" class="panel"><div class="panel-head"><strong id="propertyTitle">Vlastnosti</strong><button id="inspectorClose" aria-label="Skrýt vlastnosti">×</button></div><section id="diodeLab" hidden></section><div id="properties"></div><section id="measurements"></section></aside></main>
<div id="contextMenu" class="context-menu" hidden></div><div id="toast" role="status" hidden></div><dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="dialogClose" aria-label="Zavřít dialog">×</button></div><div id="dialogContent"></div></dialog><dialog id="diodeTable"><div class="dialog-head"><h2>V–A charakteristika · <span id="diodeTableDevice"></span></h2><button id="diodeTableClose" aria-label="Zavřít tabulku">×</button></div><p>Vypočtené body simulace. Proud je kladný ve směru A → K.</p><div class="actions"><button data-diode-action="capture">Přidat aktuální bod</button><button data-diode-action="fill">Přidat body ze záznamu</button><button data-diode-action="csv">Export CSV</button><button data-diode-action="clear">Vymazat body</button><output id="diodeTableCount"></output></div><p id="diodeTableMessage" hidden></p><div class="diode-table-scroll"><table><thead><tr><th>Bod</th><th>t [ms]</th><th>U<sub>S</sub> [V]</th><th>U<sub>D</sub> [V]</th><th>U<sub>RS</sub> [V]</th><th>I<sub>D</sub> [mA]</th></tr></thead><tbody><tr id="diodeCurrentRow"></tr></tbody><tbody id="diodeTableRows"></tbody></table></div></dialog><div id="solverError" hidden role="alert"><span></span><button id="retrySolver">Opakovat výpočet</button></div><input type="file" id="fileInput" accept=".json,.shieldio,application/json" hidden><script type="module" src="./app.mjs"></script></body></html>
