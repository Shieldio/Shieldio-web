name: Nasadit hlavní web na Cloudflare Workers
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'instructions/**'
      - '*.html'
      - 'company/**'
      - 'products/**'
      - 'edu/**'
      - 'aktuality/**'
      - '3D-tisk/**'
      - 'wrangler.jsonc'
      - 'workers/main-web.mjs'
      - 'scripts/generate-readable-guides.mjs'
      - 'tests/readable-guides.test.mjs'
      - 'tests/main-web-markdown.test.mjs'
      - 'tests/security-baseline.test.mjs'
      - 'tests/block-project-validation.test.mjs'
      - 'tests/site-ai-discovery.test.mjs'
      - 'llms.txt'
      - 'sitemap.xml'
      - '.assetsignore'
      - '_redirects'
      - '.github/workflows/deploy-main-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-shieldio-web
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Připravit textové verze návodů bez JavaScriptu
        run: node scripts/generate-readable-guides.mjs
      - name: Ověřit úplnost textových návodů
        run: node --test tests/readable-guides.test.mjs
      - name: Ověřit Markdown pro AI agenty
        run: node --test tests/main-web-markdown.test.mjs
      - name: Ověřit popisy pro vyhledávače a AI
        run: node --test tests/site-ai-discovery.test.mjs
      - name: Ověřit bezpečnostní hlavičky a routování
        run: node --test tests/security-baseline.test.mjs
      - name: Ověřit validaci blokových projektů
        run: node --test tests/block-project-validation.test.mjs
      - name: Ověřit zdroje editoru
        run: |
          node --check assets/js/block-project-validation.js
          node --check assets/js/blockly-editor.js
          node --check assets/js/arduino-programming.mjs
          python3 -c "import json; json.load(open('assets/data/i18n.json'))"
      - name: Nasadit hlavní web
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 59bdd3e4bfcd4d55e96cfdf4dc879fc4
          wranglerVersion: '4.158.0'
          command: deploy --config wrangler.jsonc
      - name: Zkontrolovat HTTP content negotiation na produkci
        shell: bash
        run: |
          set -euo pipefail
          echo "Kontrola bezpečnostních hlaviček a odmítnutí cizích assetů"
          curl -fsSI --max-time 25 "https://shieldio.cz/" -o /tmp/shieldio-security-headers
          grep -qi '^x-content-type-options: nosniff' /tmp/shieldio-security-headers || { echo "::error::Chybí ochrana MIME"; exit 1; }
          grep -qi '^x-frame-options: DENY' /tmp/shieldio-security-headers || { echo "::error::Chybí ochrana proti clickjackingu"; exit 1; }
          grep -qi '^content-security-policy:.*frame-ancestors' /tmp/shieldio-security-headers || { echo "::error::Chybí ochrana proti vkládání do cizích iframe"; exit 1; }
          for restricted in learn/maturita/elektronika/ services/esp32-compiler/server.py; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "https://shieldio.cz/$restricted")
            test "$status" = 404 || { echo "::error::Cizí statická větev $restricted vrátila $status místo 404"; exit 1; }
          done
          for url in "https://shieldio-web.swwzr5pj2f.workers.dev/" "https://shieldio.cz/"; do
            echo "Kontrola $url"
            html_type=$(curl -fsSL --max-time 25 -o /dev/null -w '%{content_type}' "$url")
            md_type=$(curl -fsSL --max-time 25 -H 'Accept: text/markdown' -o /tmp/shieldio-response.md -w '%{content_type}' "$url")
            echo "HTML: $html_type"
            echo "Markdown: $md_type"
            test "${html_type%%;*}" = "text/html" || { echo "::error::Očekává se text/html na $url"; exit 1; }
            test "${md_type%%;*}" = "text/markdown" || { echo "::error::Očekává se text/markdown na $url"; exit 1; }
            grep -q 'Shieldio' /tmp/shieldio-response.md || { echo "::error::V odpovědi chybí obsah Shieldio"; exit 1; }
          done
          echo "Kontrola živého importu blokových projektů"
          for entry in "instructions/blokovy-editor.html|block-project-validation.js|/tmp/shieldio-editor.html" "assets/js/block-project-validation.js|SHIELDIO_BLOCK_PROJECT|/tmp/shieldio-validator.js"; do
            IFS='|' read -r path marker destination <<< "$entry"
            valid=0
            for attempt in 1 2 3 4 5 6; do
              for host in shieldio.cz shieldio-web.swwzr5pj2f.workers.dev; do
                check_url="https://$host/$path?build=$GITHUB_SHA-$attempt"
                code=$(curl -sSL --max-time 25 -H 'Cache-Control: no-cache' -o "$destination" -w '%{http_code}' "$check_url")
                echo "$check_url: HTTP $code"
                if [ "$code" = 200 ] && grep -q "$marker" "$destination"; then valid=1; break; fi
              done
              if [ "$valid" = 1 ]; then break; fi
              sleep 3
            done
            test "$valid" = 1 || { echo "::error::Chybí veřejný soubor nebo jeho obsah: $path"; exit 1; }
          done
          echo "Kontrola průvodce pro školy a kroužky"
          guide_url="https://shieldio.cz/edu/pro-koho-je-shieldio/?build=$GITHUB_SHA"
          curl -fsSL --max-time 25 "$guide_url" -o /tmp/shieldio-audience.html
          grep -q '<h1>Pro koho je Shieldio RED?</h1>' /tmp/shieldio-audience.html || { echo "::error::Nová cílová stránka neobsahuje titulek"; exit 1; }
          curl -fsSL --max-time 25 -H 'Accept: text/markdown' "$guide_url" -o /tmp/shieldio-audience.md
          grep -q 'Pro koho je Shieldio RED' /tmp/shieldio-audience.md || { echo "::error::Průvodce není čitelný v Markdownu"; exit 1; }
          grep -q 'Deska zatím není v prodeji' /tmp/shieldio-audience.md || { echo "::error::Chybí upozornění na nedostupnost RED"; exit 1; }
          for slug in sestaveni zavora parkovaci-asistent casovac theremin; do
            url="https://shieldio.cz/instructions/baseline/red/$slug/"
            echo "Kontrola úplného návodu: $url"
            curl -fsSL --max-time 25 "$url" -o /tmp/shieldio-guide.html
            curl -fsSL --max-time 25 -H 'Accept: text/markdown' "$url" -o /tmp/shieldio-guide.md
            if ! grep -q 'id="guide-text-content"' /tmp/shieldio-guide.html; then
              echo "::warning::První HTML odpověď je zastaralá: $slug; ověřuji aktuální nasazení"
              for attempt in 1 2 3 4 5 6; do
                sleep 3
                curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$url?build=$GITHUB_SHA-$attempt" -o /tmp/shieldio-guide.html
                if grep -q 'id="guide-text-content"' /tmp/shieldio-guide.html; then break; fi
              done
              if ! grep -q 'id="guide-text-content"' /tmp/shieldio-guide.html; then
                echo "::warning::Výpis diagnostiky HTML odpovědi pro $slug"
                head -c 900 /tmp/shieldio-guide.html
                echo
                curl -sSI --max-time 25 "$url" | head -25
              fi
            fi
            grep -q 'id="guide-text-content"' /tmp/shieldio-guide.html || { echo "::error::Chybí bez-JS návod: $slug"; exit 1; }
            if ! grep -q '^## Krok 1:' /tmp/shieldio-guide.md; then
              echo "::warning::První odpověď neobsahuje začátek postupu: $slug"
              echo "První řádky Markdown odpovědi:"
              sed -n '1,50p' /tmp/shieldio-guide.md
              echo "Kontrola čerstvé verze obsahu"
              curl -fsSL --max-time 25 -H 'Accept: text/markdown' -H 'Cache-Control: no-cache' "$url?build=$GITHUB_SHA" -o /tmp/shieldio-guide.md
            fi
            grep -q '^## Krok 1:' /tmp/shieldio-guide.md || { echo "::error::Markdown neobsahuje postup: $slug"; exit 1; }
            grep -q '^## Součástky a vybavení' /tmp/shieldio-guide.md || { echo "::error::Markdown neobsahuje součástky: $slug"; exit 1; }
          done
