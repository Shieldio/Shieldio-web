name: Nasadit Luxmaxing na Cloudflare Workers
on:
  push:
    branches: [main]
    paths:
      - 'luxmaxing/**'
      - 'wrangler.luxmaxing.jsonc'
      - '.github/workflows/deploy-luxmaxing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-luxmaxing
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ověřit SEO a indexaci subdomén
        run: node --test tests/subdomain-seo.test.mjs
      - name: Ověřit přihlašovací údaje
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Nastavte repository secret CLOUDFLARE_API_TOKEN pro nasazení Luxmaxing."
            exit 1
          fi
      - name: Nasadit Worker a vlastní doménu
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 59bdd3e4bfcd4d55e96cfdf4dc879fc4
          command: deploy --config wrangler.luxmaxing.jsonc
