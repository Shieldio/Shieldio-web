name: Nasadit Flight360 na Cloudflare Workers
on:
  push:
    branches: [main]
    paths:
      - 'experiments/flight360/**'
      - 'wrangler.flight360.jsonc'
      - 'workers/flight360.mjs'
      - 'tests/flight360-embed.test.mjs'
      - '.github/workflows/deploy-flight360.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-flight360
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ověřit embed směrování a hlavičky
        run: node --test tests/flight360-embed.test.mjs
      - name: Ověřit přihlašovací údaje
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 59bdd3e4bfcd4d55e96cfdf4dc879fc4
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Nastavte repository secrets CLOUDFLARE_API_TOKEN pro nasazení Flight360."
            exit 1
          fi
      - name: Nasadit Worker a vlastní doménu
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 59bdd3e4bfcd4d55e96cfdf4dc879fc4
          command: deploy --config wrangler.flight360.jsonc
