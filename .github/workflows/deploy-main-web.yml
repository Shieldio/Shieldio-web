name: Nasadit hlavní web Shieldio na Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-main-web.yml'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'workers/main-web.mjs'
      - 'tests/main-web-markdown.test.mjs'
      - 'index.html'
      - 'faq.html'
      - '404.html'
      - 'products/**'
      - 'instructions/**'
      - 'company/**'
      - 'aktuality/**'
      - 'edu/**'
      - 'assets/**'
      - '_redirects'
      - 'llms.txt'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-main-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ověřit Markdown vyjednávání
        run: node --test tests/main-web-markdown.test.mjs
      - name: Ověřit obsah, odkazy a překlady
        run: python3 tests/site-content.test.py
      - name: Ověřit přístup k Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Chybí CLOUDFLARE_API_TOKEN."
            exit 1
          fi
      - name: Nasadit hlavní Worker a statické soubory
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 59bdd3e4bfcd4d55e96cfdf4dc879fc4
          wranglerVersion: '4.151.3'
          command: deploy --config wrangler.jsonc
