name: Test Arduino programming
on:
  push:
    branches: [main, codex/safari-mlink-20261102]
    paths:
      - 'assets/js/arduino-*.mjs'
      - 'tests/arduino-*.mjs'
      - 'instructions/blokovy-editor.html'
      - '.github/workflows/test-arduino.yml'
  pull_request:
    paths:
      - 'assets/js/arduino-*.mjs'
      - 'tests/arduino-*.mjs'
      - 'instructions/blokovy-editor.html'
permissions:
  contents: read
jobs:
  programming:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/arduino-programming.mjs
      - run: node --check assets/js/arduino-mlink.mjs
      - run: node --test tests/arduino-flasher.test.mjs
      - run: node tests/arduino-mlink.test.mjs
      - run: node tests/arduino-programming-ui.test.mjs
