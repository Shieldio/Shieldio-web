name: Test Arduino programming
on:
  push:
    branches: [main, codex/site-audit-fixes-20261103, codex/interaction-fixes-20261104]
    paths:
      - 'esp32/**'
      - 'tests/esp32*.mjs'
      - 'services/esp32-compiler/**'
      - 'assets/js/arduino-*.mjs'
      - 'index.html'
      - 'faq.html'
      - 'products/**'
      - 'company/**'
      - 'instructions/**'
      - 'edu/**'
      - 'aktuality/**'
      - 'assets/data/i18n.json'
      - 'assets/data/search-index.json'
      - 'assets/js/guide-*.js'
      - 'assets/js/concept-labs.js'
      - 'assets/js/level-toggle.js'
      - 'assets/css/component-lessons.css'
      - 'assets/js/site-chrome.js'
      - 'assets/js/search.js'
      - 'assets/js/theme.js'
      - 'assets/js/pwm-sim.js'
      - 'assets/js/resistor-calculator.js'
      - 'assets/js/contact-form.js'
      - 'sitemap.xml'
      - '_redirects'
      - 'llms.txt'
      - 'wrangler.jsonc'
      - 'workers/main-web.mjs'
      - 'tests/main-web-markdown.test.mjs'
      - 'tests/readable-guides.test.mjs'
      - 'scripts/generate-readable-guides.mjs'
      - 'assets/js/guide-data-*.js'
      - 'tests/site-*'
      - 'tests/legal-guardrails.py'
      - 'README.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'assets/js/avr-compiler.mjs'
      - 'assets/js/shieldio-blocks.js'
      - 'assets/js/blockly-editor.js'
      - 'assets/arduino/**'
      - 'assets/css/arduino-programming.css'
      - 'tests/arduino-*.mjs'
      - 'instructions/blokovy-editor.html'
      - '.github/workflows/test-arduino.yml'
  pull_request:
    paths:
      - 'esp32/**'
      - 'tests/esp32*.mjs'
      - 'services/esp32-compiler/**'
      - 'assets/js/arduino-*.mjs'
      - 'index.html'
      - 'faq.html'
      - 'products/**'
      - 'company/**'
      - 'instructions/**'
      - 'edu/**'
      - 'aktuality/**'
      - 'assets/data/i18n.json'
      - 'assets/data/search-index.json'
      - 'assets/js/guide-*.js'
      - 'assets/js/concept-labs.js'
      - 'assets/js/level-toggle.js'
      - 'assets/css/component-lessons.css'
      - 'assets/js/site-chrome.js'
      - 'assets/js/search.js'
      - 'assets/js/theme.js'
      - 'assets/js/pwm-sim.js'
      - 'assets/js/resistor-calculator.js'
      - 'assets/js/contact-form.js'
      - 'sitemap.xml'
      - '_redirects'
      - 'llms.txt'
      - 'wrangler.jsonc'
      - 'workers/main-web.mjs'
      - 'tests/main-web-markdown.test.mjs'
      - 'tests/readable-guides.test.mjs'
      - 'scripts/generate-readable-guides.mjs'
      - 'assets/js/guide-data-*.js'
      - 'tests/site-*'
      - 'tests/legal-guardrails.py'
      - 'README.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'assets/js/avr-compiler.mjs'
      - 'assets/js/shieldio-blocks.js'
      - 'assets/js/blockly-editor.js'
      - 'assets/arduino/**'
      - 'assets/css/arduino-programming.css'
      - 'tests/arduino-*.mjs'
      - 'instructions/blokovy-editor.html'
permissions:
  contents: read
jobs:
  programming:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BLOCKLY_TEST_DIR: /tmp/shieldio-test-deps/node_modules/blockly
      JSDOM_TEST_PACKAGE: /tmp/shieldio-test-deps/node_modules/jsdom
      KATEX_TEST_PACKAGE: /tmp/shieldio-test-deps/node_modules/katex
      XMLDOM_TEST_PACKAGE: /tmp/shieldio-test-deps/node_modules/@xmldom/xmldom/lib/index.js
      BLOCKLY_FIXTURES: /tmp/shieldio-block-fixtures.json
      AVR_TOOLCHAIN_DIR: /tmp/shieldio-avr/package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate-readable-guides.mjs
      - run: node --test tests/readable-guides.test.mjs
      - run: node --test tests/main-web-markdown.test.mjs
      - run: python3 tests/site-content.test.py
      - run: python3 tests/legal-guardrails.py
      - run: node tests/site-search.test.mjs
      - run: node --check assets/js/guide-engine.js
      - run: node --check assets/js/arduino-programming.mjs
      - run: node --check assets/js/arduino-compiler-worker.mjs
      - run: node --check assets/js/shieldio-blocks.js
      - run: node --check assets/js/blockly-editor.js
      - run: node --test tests/arduino-flasher.test.mjs
      - run: node tests/arduino-serial-monitor.test.mjs
      - run: node tests/arduino-programming-ui.test.mjs
      - run: node tests/arduino-editor-assist.test.mjs
      - run: node tests/esp32-studio.test.mjs
      - run: python3 -m unittest discover -s services/esp32-compiler -p 'test_*.py'
      - run: node tests/arduino-libraries.test.mjs
      - run: node tests/arduino-compiler-worker.test.mjs
      - name: Install headless Blockly test dependencies
        run: npm install --prefix "/tmp/shieldio-test-deps" --ignore-scripts --no-audit --no-fund --no-save blockly@13.2.1 @xmldom/xmldom@0.8.11 jsdom@27.4.0 katex@0.16.11
      - run: node tests/arduino-blocks.test.mjs
      - run: node tests/site-interactions.test.mjs
      - run: node tests/site-learning.test.mjs
      - run: node tests/site-journeys.test.mjs
      - run: node tests/arduino-distance.test.mjs
      - name: Download pinned AVR toolchain for real compilation tests
        run: curl --fail --location --retry 2 https://registry.npmjs.org/@horang-corp/avr-gcc-wasm/-/avr-gcc-wasm-0.2.0.tgz --output "/tmp/shieldio-avr.tgz"
      - name: Extract test compiler
        run: |
          mkdir -p "/tmp/shieldio-avr"
          tar -xzf "/tmp/shieldio-avr.tgz" -C "/tmp/shieldio-avr"
      - run: node --test tests/arduino-compiler.test.mjs


