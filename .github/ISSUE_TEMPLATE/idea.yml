name: Navrhnout zlepšení
description: Nápad na srozumitelnější krok, projekt nebo funkci.
title: "[Nápad] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Co dnes ztěžuje práci?
      description: Popiš konkrétní situaci a komu se stává.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Jak by měl vypadat lepší výsledek?
      description: Napiš, co by člověk dokázal udělat nebo pochopit snáz.
    validations:
      required: true
